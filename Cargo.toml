[package]
name = "agt"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
description = "Agentic-first testing: a Rust test framework whose primary consumer is an autonomous agent"
license = "MIT"
repository = "https://github.com/oddurs/ag-test"
keywords = ["testing", "agents", "determinism", "evidence"]
categories = ["development-tools::testing"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "warn"
