name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x -s bash \
            bin/agent \
            lib/*.sh \
            scripts/*.sh \
            .githooks/commit-msg \
            .githooks/pre-commit \
            agent.config.sh

  backlog:
    name: backlog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cairn
        # Not the `cairn` on crates.io - that name belongs to an unrelated
        # placeholder crate. Install from source, pinned to a tag.
        run: cargo install --git https://github.com/oddurs/cairn --tag v0.1.0-rc.1 --locked cairn
      - name: validate items against the schema
        run: cairn check
      - name: roadmap is current
        run: |
          set -euo pipefail
          cairn render -q
          git diff --exit-code ROADMAP.md \
            || { echo "ROADMAP.md is stale - run \`cairn render\`" >&2; exit 1; }

  harness:
    name: worktree harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: bootstrap
        run: ./scripts/setup.sh
      - name: agent doctor
        # The agent CLI is absent on CI; doctor reports it and still exits 0.
        run: ./bin/agent doctor
      - name: worktree lifecycle
        run: |
          set -euo pipefail
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          ./bin/agent new smoke-check
          test -d .worktrees/smoke-check
          ./bin/agent ls
          echo "smoke" > .worktrees/smoke-check/SMOKE
          AGENT_AUTO_PUSH=0 ./bin/agent ship smoke-check -m "smoke check" --no-pr
          git log --oneline -1 agent/smoke-check
          ./bin/agent rm smoke-check
          test ! -d .worktrees/smoke-check
